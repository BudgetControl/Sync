name: Deploy Sync development

on:
  workflow_dispatch:
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  run-tests:
    uses: ./.github/workflows/test_php-tests.yml

  deploy:
    needs: run-tests
    runs-on: ubuntu-latest
    environment: dev
    concurrency:
      group: sync-development
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare deployment files
        run: |
          mkdir -p deploy-package
          git archive HEAD | tar -x -C deploy-package

      - name: Deploy files
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: ${{ secrets.SFTP_USER }}
          server: ${{ secrets.SFTP_HOST }}
          port: ${{ secrets.SFTP_PORT }}
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
          password: ${{ secrets.SFTP_PASSWORD }}
          local_path: './deploy-package/*'
          remote_path: ${{ secrets.SFTP_PATH }}
          sftpArgs: '-o ConnectTimeout=5'

      - name: Install service dependencies
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port: ${{ secrets.SFTP_PORT }}
          script: docker exec budgetcontrol-ms-sync composer install --no-dev --no-interaction --optimize-autoloader
