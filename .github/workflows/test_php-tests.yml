name: PHP Tests

on:
  pull_request:
    branches: [main, develop]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:13.18
        env:
          POSTGRES_DB: sync_test
          POSTGRES_USER: sync_test
          POSTGRES_PASSWORD: sync_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sync_test -d sync_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, mbstring, openssl, pdo_pgsql
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress

      - name: Run synchronization checks
        env:
          SYNC_TEST_DB_DRIVER: pgsql
          SYNC_TEST_DB_HOST: 127.0.0.1
          SYNC_TEST_DB_PORT: 5432
          SYNC_TEST_DB_DATABASE: sync_test
          SYNC_TEST_DB_USERNAME: sync_test
          SYNC_TEST_DB_PASSWORD: sync_test
        run: php Test/ManualSyncCheck.php
