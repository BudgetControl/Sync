name: Build and Push Docker Image

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      image_tag:
        description: Docker image tag
        type: string
        required: true

permissions:
  contents: read

jobs:
  run-tests:
    uses: ./.github/workflows/test_php-tests.yml

  build:
    needs: run-tests
    environment: docker-prod
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate image tag
        id: image-tag
        env:
          IMAGE_TAG: ${{ inputs.image_tag || github.ref_name }}
        run: |
          if [[ ! "$IMAGE_TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo "Invalid Docker image tag"
            exit 1
          fi
          echo "value=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/sync:${{ steps.image-tag.outputs.value }}
