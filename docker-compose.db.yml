services:
  database:
    container_name: budgetcontrol-sync-db
    image: postgres:13.18
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    ports:
      - "5433:5432"
    volumes:
      - sync_pgdata:/var/lib/postgresql/data
    networks:
      - budgetcontrol_network
volumes:
  sync_pgdata:
networks:
  budgetcontrol_network:
    external: true
